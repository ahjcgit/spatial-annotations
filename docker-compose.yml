services:
  backend:
    build: ./backend
    ports:
      - "0.0.0.0:${BACKEND_PORT:-8000}:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/annotations.db}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-24}
    volumes:
      - annotations-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3
volumes:
  annotations-data:
